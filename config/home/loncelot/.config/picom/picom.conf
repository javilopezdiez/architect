# Backend
backend = "glx";

# Force vsync (optional but stabilizes visuals)
# vsync = true;

# Opacity rule for Thorium
opacity-rule = [
  "93:class_g = 'Thorium-browser' && name *= 'ChatGPT'",
  "85:class_g = 'xfce4-terminal'",
  "90:class_g = 'Code'",
  "85:name = 'yt-x'",
  "85 :class_g = 'Thunar'"
];

# General window opacity (optional baseline)
# active-opacity = 0.85;
# inactive-opacity = 0.85;

# Blur (SAFE mode - works in most builds)
# blur-background = true;
# blur-method = "kernel";
# blur-strength = 3;

# Shadow (helps visually confirm compositor is active)
# shadow = true;
# shadow-radius = 12;
# shadow-opacity = 1;